name: Build VEDAgram APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vedagram-branding

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create private.properties
        run: |
          cat > private.properties <<EOF
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          KEYSTORE_PATH=../finegram-debug.jks
          KEYSTORE_PASSWORD=finegram
          KEY_ALIAS=finegram
          KEY_PASSWORD=finegram
          EOF

      - name: Build APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vedagram-apk
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
            dist/*.apk
          if-no-files-found: error
